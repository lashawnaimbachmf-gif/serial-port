[package]
name = "serial-desk"
version = "1.2.0"
description = "A precise, quiet serial workbench for Windows"
authors = ["Serial Desk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "serial_desk_lib"
crate-type = ["rlib"]

[[bin]]
name = "SerialDesk"
path = "src/main.rs"

# Command line interface. It shares the byte-exact session core and the log
# format with the GUI, but does not link Tauri or need WebView2, so it can be
# built and used on a headless build machine or by an AI agent.
[[bin]]
name = "sdesk"
path = "src/bin/sdesk.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = "4.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rfd = { version = "0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Devices_Communication",
  "Win32_Foundation",
  "Win32_System_Console",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
